[package]
name = "saturn"
description = "A terminal grid for running many Claude Code agents side by side"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Lets SATURN_SCREENSHOT save what the window draws (spikes and tests); never in normal builds.
capture = ["dep:gpui-pre", "dep:gpui-pre-platform", "dep:image"]

[dependencies]
saturn-core.workspace = true
saturn-design.workspace = true
saturn-terminal.workspace = true
gpui-kit.workspace = true
serde.workspace = true
saturn-bridge.workspace = true
async-channel.workspace = true
serde_json.workspace = true
gpui-pre = { version = "=0.3.9", features = ["test-support"], optional = true }
gpui-pre-platform = { version = "=0.3.9", features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSDockTile",
  "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[package.metadata.cargo-machete]
# Only switched on by the `capture` feature, to turn on GPUI's window-to-image support.
ignored = ["gpui-pre", "gpui-pre-platform", "image"]

[lints]
workspace = true
