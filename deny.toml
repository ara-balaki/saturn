# cargo deny: Saturn stays permissively licensed, so no copyleft dependency may come in.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "OFL-1.1",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "NCSA",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "warn"
# Vulnerabilities fail everywhere. "Unmaintained" notices count only for crates Saturn depends on
# directly: the deep ones come through GPUI (font parsing, Linux D-Bus) and are upstream's to replace.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
